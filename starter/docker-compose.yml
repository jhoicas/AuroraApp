

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: aurora-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        # En EC2 con IP pública: http://<TU_IP>:8081/api/v1
        # Same-origin vía Nginx proxy: /api/v1
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: aurora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
