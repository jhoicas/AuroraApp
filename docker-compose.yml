version: '3.9'

services:
  backend:
    build:
      context: ./starter/backend
      dockerfile: Dockerfile
    container_name: aurora-backend  # Nombre fijo para que el frontend lo encuentre
    ports:
      - '8080:8080'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - PORT=8080
    networks:
      - aurora-net
    restart: unless-stopped

  frontend:
    build:
      context: ./starter/frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'  # Ahora tu app se abrirá en http://localhost/ en lugar de 3000
    depends_on:
      - backend
    networks:
      - aurora-net
    restart: unless-stopped

networks:
  aurora-net:
    driver: bridge