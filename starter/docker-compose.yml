services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: aurora-backend
    restart: unless-stopped
    # DATABASE_URL y secretos vienen ÚNICAMENTE de backend/.env (BD real).
    # No se inyecta Postgres local ni valores por defecto de conexión.
    env_file:
      - ./backend/.env
    environment:
      # Solo fuerza el puerto del contenedor; DATABASE_URL / JWT / keys salen de env_file.
      PORT: "8080"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: aurora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
